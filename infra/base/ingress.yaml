# ─────────────────────────────────────────────────────────────────────────────
# NGINX Ingress – path-based routing
#
#   /service-a/*  →  service-a:80
#   /service-b/*  →  service-b:80
#
# Prerequisites (Ingress controller installed in the AKS):
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-asgmt-app-ingress
  namespace: ms-asgmt-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rate limiting (production safeguard)
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /service-a(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service-a
                port:
                  name: http
          - path: /service-b(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: service-b
                port:
                  name: http
