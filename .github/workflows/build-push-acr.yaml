name: Build & Push to ACR

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to build"
        required: true
        default: "all"
        type: choice
        options:
          - service-a
          - service-b
          - all

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve services to build
        id: matrix
        run: |
          INPUT="${{ github.event.inputs.service }}"
          if [ "$INPUT" = "all" ]; then
            echo "services=service-a service-b" >> $GITHUB_OUTPUT
          else
            echo "services=$INPUT" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: |
          ACR_NAME=$(az acr list --query "[0].name" --output tsv)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACR_SERVER=${ACR_NAME}.azurecr.io" >> $GITHUB_ENV
          az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for SERVICE in ${{ steps.matrix.outputs.services }}; do
            echo "▶ Building $SERVICE..."
            docker build \
              --platform linux/amd64 \
              --tag "${ACR_SERVER}/${SERVICE}:${SHORT_SHA}" \
              --tag "${ACR_SERVER}/${SERVICE}:latest" \
              --file "applications/${SERVICE}/Dockerfile" \
              "applications/${SERVICE}/"

            echo "▶ Pushing $SERVICE..."
            docker push "${ACR_SERVER}/${SERVICE}:${SHORT_SHA}"
            docker push "${ACR_SERVER}/${SERVICE}:latest"
          done